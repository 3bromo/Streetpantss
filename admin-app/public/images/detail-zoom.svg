<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <pattern id="twill" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#0B2555"/>
      <rect width="7" height="14" fill="#0E2C66"/>
    </pattern>
    <radialGradient id="light" cx="0.3" cy="0.22" r="1.1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="metal" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#E8EBF1"/>
      <stop offset="0.55" stop-color="#AAB3C4"/>
      <stop offset="1" stop-color="#77819A"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#twill)"/>
  <path d="M 292 0 L 292 1200" stroke="#C9D2E4" stroke-width="3" stroke-dasharray="10 8" opacity="0.5"/>
  <path d="M 608 0 L 608 1200" stroke="#C9D2E4" stroke-width="3" stroke-dasharray="10 8" opacity="0.5"/>
  <rect x="120" y="180" width="46" height="180" fill="#081C45" stroke="#051334" stroke-width="3"/>
  <circle cx="450" cy="760" r="230" fill="#02060f" opacity="0.5" filter="url(#soft)"/>
  <circle cx="450" cy="740" r="200" fill="url(#metal)"/>
  <circle cx="450" cy="740" r="160" fill="none" stroke="#5E6880" stroke-width="5"/>
  <circle cx="450" cy="740" r="34" fill="none" stroke="#5E6880" stroke-width="6"/>
  <text x="450" y="752" text-anchor="middle" font-family="'IBM Plex Mono','Courier New',monospace" font-size="30" letter-spacing="2" fill="#49536B" font-weight="600">SP</text>
  <rect width="900" height="1200" fill="url(#light)"/>
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.6"/>
  
  <text x="48" y="1126" font-family="'IBM Plex Mono','Courier New',monospace" font-size="17" font-weight="500" letter-spacing="6" fill="#071A3D" opacity="0.55">STREET PANTS</text>
  <text x="48" y="1152" font-family="'IBM Plex Mono','Courier New',monospace" font-size="12" letter-spacing="4" fill="#071A3D" opacity="0.34">05 / DETAIL — HARDWARE</text>
</svg>